[project]
name = "rl-newton"
version = "0.1.0"
description = "RL-controlled Hessian-free Newton-CG optimization: 강화학습으로 Newton-CG의 damping / CG 예산 / step size를 제어하는 실험"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }

dependencies = [
    # --- 수치 커널 ---
    "torch>=2.11.0",
    "torchvision>=0.26.0",
    "numpy>=2.1.0",
    "scipy>=1.15.0",
    # --- 강화학습 ---
    "gymnasium>=1.2.0",
    "stable-baselines3>=2.9.0",
    # --- 설정 / 로깅 / 분석 ---
    "pyyaml>=6.0.2",
    "pandas>=2.2.0",
    "matplotlib>=3.10.0",
    "tensorboard>=2.19.0",
    "tqdm>=4.67.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "ruff>=0.9.0",
]

# ---------------------------------------------------------------------------
# PyTorch 배포 인덱스
#
# torch는 accelerator별로 별도 인덱스에 게시된다 (+cpu / +cu130 등).
# 이 프로젝트의 대상 하드웨어는 RTX 3060 Ti (Ampere, sm_86) 이므로 CUDA 13.0 빌드를 쓴다.
# explicit = true 로 두어 torch 계열 외 패키지는 계속 PyPI에서 받도록 제한한다.
# macOS에는 CUDA 빌드가 없으므로 sys_platform 마커로 win32 / linux 로 한정한다.
# 참고: https://docs.astral.sh/uv/guides/integration/pytorch/
# ---------------------------------------------------------------------------
[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = [
    { index = "pytorch-cu130", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
torchvision = [
    { index = "pytorch-cu130", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]

[tool.uv]
# 정확한 버전 고정은 uv.lock 이 담당한다 (해시 포함). pyproject 에는 하한만 둔다.
# uv.lock 은 반드시 커밋한다.
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rl_newton"]

# ---------------------------------------------------------------------------
# 테스트
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "cuda: CUDA 디바이스가 필요한 테스트",
    "slow: 수 분 이상 걸리는 테스트",
]

# ---------------------------------------------------------------------------
# 린트
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = [
    "E501", # line-length 는 formatter 가 처리
]
